<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Comet achievement">
  <defs>
    <linearGradient id="tailGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#FFD54A" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FFB74D" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
  </defs>

  <!-- Comet tail -->
  <path d="M6 42 C 20 34, 34 30, 44 26" fill="none" stroke="url(#tailGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M4 46 C 18 38, 32 34, 42 30" fill="none" stroke="url(#tailGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Comet head -->
  <g transform="translate(44,24)">
    <circle cx="0" cy="0" r="8" fill="url(#headGrad)" stroke="#FFEB3B" stroke-width="1.5" />
    <circle cx="-2" cy="-2" r="2" fill="#FF7043" opacity="0.95" />
  </g>

</svg>
